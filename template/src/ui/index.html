<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>__PLUGIN_NAME__ 账号</title>
<style>
/* ===== 设计 token（与一方插件 platform/workbuddy/zcode 完全同源，勿改值）=====
   值逐项取自 src/convo/frontend/src/fnos-theme.css 的明暗两套 Semi 变量（fnOS Semi Design 风格）。
   暗色 = html.dark class（宿主主题脚本切换）。所有颜色一律走变量，禁止硬编码。 */
:root {
    color-scheme: light;
    --bg-1: rgba(255,255,255,1); --bg-2: rgba(255,255,255,1); --bg-dropdown: rgba(255,255,255,1);
    --text-0: rgba(11,11,12,1); --text-1: rgba(11,11,12,.75); --text-2: rgba(11,11,12,.5); --text-3: rgba(11,11,12,.25);
    --primary: rgba(0,102,255,1); --primary-hover: rgba(0,94,235,1); --primary-active: rgba(0,67,184,1);
    --success: rgba(0,158,97,1); --warning: rgba(224,108,0,1); --danger: rgba(219,56,44,1);
    --fill-0: rgba(11,11,12,.04); --fill-1: rgba(11,11,12,.06); --fill-2: rgba(11,11,12,.12);
    --border: rgba(11,11,12,.16); --border-hover: rgba(11,11,12,.2); --focus: rgba(0,102,255,1);
    --divider: rgba(11,11,12,.12); --overlay: rgba(0,0,0,.7);
    --primary-light: rgba(0,102,255,.12); --success-light: rgba(79,197,147,.2);
    --danger-light: rgba(241,177,164,.2); --warning-light: rgba(255,209,102,.2);
    --shadow-elevated: 0 10px 20px 0 rgba(0,0,0,.08), 0 10px 40px 0 rgba(0,0,0,.12);
}
.dark {
    color-scheme: dark;
    --bg-1: rgba(31,32,33,1); --bg-2: rgba(31,32,33,1); --bg-dropdown: rgba(46,47,48,1);
    --text-0: rgba(255,255,255,1); --text-1: rgba(242,243,244,.8); --text-2: rgba(242,243,244,.6); --text-3: rgba(242,243,244,.35);
    --primary: rgba(0,102,255,1); --primary-hover: rgba(0,84,219,1); --primary-active: rgba(0,67,184,1);
    --success: rgba(0,158,97,1); --warning: rgba(224,108,0,1); --danger: rgba(219,56,44,1);
    --fill-0: rgba(255,255,255,.04); --fill-1: rgba(255,255,255,.06); --fill-2: rgba(255,255,255,.12);
    --border: rgba(255,255,255,.16); --border-hover: rgba(255,255,255,.2); --focus: rgba(0,102,255,1);
    --divider: rgba(255,255,255,.1); --overlay: rgba(0,0,0,.6);
    --primary-light: rgba(0,102,255,.1); --success-light: rgba(48,180,127,.2);
    --danger-light: rgba(79,12,16,.2); --warning-light: rgba(233,150,61,.2);
}
* { box-sizing: border-box; }
/* 页面底色显式 bg-1（=宿主内容卡底色）：不能用透明——color-scheme:dark 时 Chrome
   会把透明画布涂黑（workbuddy 实案）。 */
html, body { background: var(--bg-1); }
body { color: var(--text-0); font: 14px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif; margin: 0; padding: 20px; user-select: none; -webkit-touch-callout: none; }
input, textarea { user-select: text; }
.muted { color: var(--text-2); font-size: 13px; white-space: pre-wrap; }
.card { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h2 { margin: 0; font-size: 16px; font-weight: 600; }
hr { border: 0; border-top: 1px solid var(--divider); margin: 2px 0; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--text-2); }
.row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
.row label { flex: 1; min-width: 150px; }
/* ===== 组件（形态对齐一方插件：Card 12px 圆角 + divider 描边；按钮 8px/字重 500；输入框 6px + 边框三态）===== */
.btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-2); color: var(--text-0); font-size: 14px; font-weight: 500; cursor: pointer; }
.btn:hover { border-color: var(--border-hover); }
.btn:active { opacity: .85; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn.primary:active { background: var(--primary-active); }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--border); }
.btn.danger:hover { border-color: var(--danger); }
.input { padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: transparent; color: var(--text-0); width: 100%; }
.input:hover { border-color: var(--border-hover); }
.input:focus { outline: 0; border-color: var(--focus); }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; color: var(--text-2); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--divider); }
.table td { padding: 8px; border-bottom: 1px solid var(--divider); }
.tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: var(--fill-1); color: var(--text-1); }
.tag.ok { background: var(--success-light); color: var(--success); }
.tag.warn { background: var(--warning-light); color: var(--warning); }
/* 环境告警横幅（勿删——__CONVO_ABS__ 缺失 = 宿主环境异常，见 docs/rules.md） */
#env-warn { display: none; margin-bottom: 12px; padding: 10px 12px; border: 1px solid var(--warning); border-radius: 8px; font-size: 13px; color: var(--warning); background: var(--warning-light); }
</style>
</head>
<body>
<div id="env-warn">⚠ 未检测到宿主注入的 <code>__CONVO_ABS__</code>——convo 版本过旧，或页面不是从控制台·平台管理页打开。API 调用可能全部失败，排查步骤见 docs/rules.md。</div>
<main class="card">
  <h2>__PLUGIN_NAME__</h2>
  <p class="muted">OpenAI 兼容平台接入（脚手架模板）：API Key + Base URL 直配。</p>
  <div class="row">
    <label>API Key<input id="api_key" class="input" placeholder="sk-..." autocomplete="off"/></label>
    <label>Base URL<input id="base_url" class="input" placeholder="https://api.example.com/v1" autocomplete="off"/></label>
    <button id="add" class="btn primary">验证并添加</button>
  </div>
  <pre id="out" class="muted"></pre>
  <hr/>
  <div>
    <h2 style="font-size:15px">已添加账号</h2>
    <table class="table">
      <thead><tr><th>#</th><th>账号</th><th>状态</th><th>更新时间</th><th></th></tr></thead>
      <tbody id="accounts"></tbody>
    </table>
    <p id="accounts-empty" class="muted">（暂无账号）</p>
  </div>
</main>
<script>
// 【约定】插件 UI 的 API 调用一律用绝对 URL。基址采信规则（纵深防御）：
// 宿主注入 __CONVO_ABS__ 只在「与页面真实 origin 同前缀」时采信（location.origin 校验），
// 否则回退 pathname 推断——host 注入异常（如被宿主页 Referer 污染成 wails.localhost，
// API 不可达）时插件自保。根相对路径在内置浏览器（IAB）下会被重定基而 404——详见 docs/rules.md。
var INJ = window.__CONVO_ABS__;
var ABS = (INJ && INJ.indexOf(location.origin) === 0) ? INJ : (location.origin + (location.pathname.split("/plugins/")[0] || ""));

// 【环境自检】__CONVO_ABS__ 缺失 = convo 版本过旧或非平台管理页入口（此时 fallback 在
// wails.localhost 等非网关 origin 下也拼不出正确地址，请求全挂）——亮横幅说清原因，
// 别让用户对着一堆网络错误猜。
if (!window.__CONVO_ABS__) document.getElementById("env-warn").style.display = "block";

// 【主题跟随宿主】与一方插件同款机制：初始 = iframe URL 带 #dark；运行中 =
// postMessage({type:"convo:theme", theme})。切换 = html.dark class（驱动 CSS token 换色）。
(function () {
  var apply = function (t) { document.documentElement.classList.toggle("dark", t === "dark"); };
  apply(location.hash.indexOf("dark") >= 0 ? "dark" : "light");
  window.addEventListener("message", function (e) {
    var d = e.data || {};
    if (d.type === "convo:theme") apply(d.theme === "dark" ? "dark" : "light");
  });
})();

function api(method, path, body) {
  return fetch(ABS + path, {
    method: method,
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }).then(function (r) {
    return r.text().then(function (t) {
      if (!r.ok) throw new Error("HTTP " + r.status + " " + t);
      return t ? JSON.parse(t) : {};
    });
  });
}

// action(name, payload) → POST /api/plugins/<name>/action
function action(name, payload) {
  return api("POST", "/api/plugins/__PLUGIN_NAME__/action", { action: name, payload: payload });
}

var out = document.getElementById("out");
document.getElementById("add").onclick = function () {
  out.textContent = "验证中…";
  var key = document.getElementById("api_key").value.trim();
  var base = document.getElementById("base_url").value.trim();
  action("verify_key", { api_key: key, base_url: base })
    .then(function (res) {
      // verify_key 回传落库三件套 → 直接 POST 账号表落库
      return api("POST", "/api/plugins/__PLUGIN_NAME__/accounts", {
        credentials: res.credentials,
        display: res.display,
        external_id: res.external_id
      });
    })
    .then(function () { out.textContent = "✅ 已添加"; loadAccounts(); })
    .catch(function (e) { out.textContent = "❌ " + e.message; });
};

// 账号列表（display 是插件自定义 JSON，按需展示关键字段）
function loadAccounts() {
  api("GET", "/api/plugins/__PLUGIN_NAME__/accounts").then(function (rows) {
    var tb = document.getElementById("accounts");
    document.getElementById("accounts-empty").style.display = rows.length ? "none" : "block";
    tb.innerHTML = "";
    rows.forEach(function (a) {
      var d = {};
      try { d = JSON.parse(a.display) || {}; } catch (e) {}
      var tr = document.createElement("tr");
      tr.innerHTML = "<td>" + a.id + "</td>" +
        "<td>" + (d.base_url || d.external_id || ("#" + a.id)) + "</td>" +
        '<td><span class="tag ' + (a.enabled ? "ok" : "") + '">' + (a.enabled ? "启用" : "停用") + "</span></td>" +
        "<td class='muted'>" + (a.updated_at || "").slice(0, 19) + "</td>" +
        '<td style="text-align:right"><button class="btn danger" data-id="' + a.id + '">删除</button></td>';
      tb.appendChild(tr);
    });
    tb.querySelectorAll("button[data-id]").forEach(function (b) {
      b.onclick = function () {
        api("DELETE", "/api/plugins/__PLUGIN_NAME__/accounts/" + b.dataset.id)
          .then(loadAccounts)
          .catch(function (e) { out.textContent = "❌ " + e.message; });
      };
    });
  }).catch(function (e) { out.textContent = "❌ 加载账号失败: " + e.message; });
}
loadAccounts();
</script>
</body>
</html>
