<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>__PLUGIN_NAME__ 账号</title>
<style>
  :root { color-scheme: light dark; --muted: rgba(127,127,127,1); --border: rgba(127,127,127,.35); }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; }
  .card { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  h2 { margin: 0; }
  .muted { color: var(--muted); font-size: 13px; margin: 0; white-space: pre-wrap; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  input { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: transparent; color: inherit; }
  button { padding: 9px 0; border: 0; border-radius: 8px; background: #06f; color: #fff; font-size: 14px; cursor: pointer; }
  button:active { opacity: .85; }
</style>
</head>
<body>
<div id="env-warn" style="display:none; margin-bottom:12px; padding:10px 12px; border:1px solid #e6a700; border-radius:8px; font-size:13px; color:#e6a700;">
  ⚠ 未检测到宿主注入的 <code>__CONVO_ABS__</code>——convo 版本过旧，或页面不是从控制台·平台管理页打开。
  API 调用可能全部失败，排查步骤见 docs/rules.md。
</div>
<main class="card">
  <h2>__PLUGIN_NAME__</h2>
  <p class="muted">OpenAI 兼容平台接入（脚手架模板）：API Key + Base URL 直配。</p>
  <label>API Key
    <input id="api_key" placeholder="sk-..." autocomplete="off"/>
  </label>
  <label>Base URL
    <input id="base_url" placeholder="https://api.example.com/v1" autocomplete="off"/>
  </label>
  <button id="add">验证并添加账号</button>
  <pre id="out" class="muted"></pre>
</main>
<script>
// 【约定】插件 UI 的 API 调用一律用绝对 URL。基址采信规则（纵深防御）：
// 宿主注入 __CONVO_ABS__ 只在「与页面真实 origin 同前缀」时采信（location.origin 校验），
// 否则回退 pathname 推断——host 注入异常（如被宿主页 Referer 污染成 wails.localhost，
// API 不可达）时插件自保。根相对路径在内置浏览器（IAB）下会被重定基而 404——详见 docs/rules.md。
var INJ = window.__CONVO_ABS__;
var ABS = (INJ && INJ.indexOf(location.origin) === 0) ? INJ : (location.origin + (location.pathname.split("/plugins/")[0] || ""));

// 【环境自检】__CONVO_ABS__ 缺失 = convo 版本过旧或非平台管理页入口（此时 fallback 在
// wails.localhost 等非网关 origin 下也拼不出正确地址，请求全挂）——亮横幅说清原因，
// 别让用户对着一堆网络错误猜。
if (!window.__CONVO_ABS__) document.getElementById("env-warn").style.display = "block";

// 【主题跟随宿主】主应用（平台管理页）两种途径告知主题：
//   初始 = iframe URL 带 #dark 片段；运行中 = postMessage({type:"convo:theme", theme})。
// 另有 {type:"convo:layout", desktop:bool}（宽窄屏布局提示，本页用不上，按需接收）。
(function () {
  var apply = function (t) { document.documentElement.style.colorScheme = t; };
  apply(location.hash.indexOf("dark") >= 0 ? "dark" : "light");
  window.addEventListener("message", function (e) {
    var d = e.data || {};
    if (d.type === "convo:theme") apply(d.theme === "dark" ? "dark" : "light");
  });
})();

function api(method, path, body) {
  return fetch(ABS + path, {
    method: method,
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }).then(function (r) {
    return r.text().then(function (t) {
      if (!r.ok) throw new Error("HTTP " + r.status + " " + t);
      return t ? JSON.parse(t) : {};
    });
  });
}

// action(name, payload) → POST /api/plugins/<name>/action
function action(name, payload) {
  return api("POST", "/api/plugins/__PLUGIN_NAME__/action", { action: name, payload: payload });
}

document.getElementById("add").onclick = function () {
  var out = document.getElementById("out");
  out.textContent = "验证中…";
  var key = document.getElementById("api_key").value.trim();
  var base = document.getElementById("base_url").value.trim();
  action("verify_key", { api_key: key, base_url: base })
    .then(function (res) {
      // verify_key 回传落库三件套 → 直接 POST 账号表落库
      return api("POST", "/api/plugins/__PLUGIN_NAME__/accounts", {
        credentials: res.credentials,
        display: res.display,
        external_id: res.external_id
      });
    })
    .then(function () { out.textContent = "✅ 已添加"; })
    .catch(function (e) { out.textContent = "❌ " + e.message; });
};
</script>
</body>
</html>
